services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      RP_ID: gym.daffar.vn
      ORIGIN: https://gym.daffar.vn
      RP_NAME: openGym Việt Nam
      DEFAULT_LANG: vi
      FIRST_USER_ADMIN: 1
      TRUST_PROXY: 1
      AUDIT_LOG: 1
    volumes:
      - opengym-data:/data
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  web:
    build:
      context: https://github.com/thaihung34/openGym.git#main
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND: api
      PORT: 3000
      NGINX_PORT: 80
      MEDIA_UPLOAD_MAX: 48m
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
volumes:
  opengym-data:
